services:
  nginx:
    container_name: nginx
    build: requirements/nginx/.
    image: nginx
    volumes:
      - wordpress:/var/www/html
      - ssl:/etc/nginx/ssl
    depends_on:
      - wordpress
    networks:
      - inception
    ports:
      - "443:443"
    restart: on-failure
    env_file:
      - .env

  wordpress:
    container_name: wordpress
    build: requirements/wordpress/.
    image: wordpress
    volumes:
      - wordpress:/var/www/html
    depends_on:
      - mariadb
    networks:
      - inception
    restart: on-failure
    expose:
      - "9000"
    env_file:
      - .env
    environment:
      DB_PASSWORD: /run/secrets/db_password
      WP_ADMIN_PASSWORD: /run/secrets/wp_admin_password
      WP_USER_PASSWORD: /run/secrets/wp_user_password
    secrets:
      - db_password
      - wp_admin_password
      - wp_user_password

  mariadb:
    container_name: mariadb
    build: requirements/mariadb/.
    image: mariadb
    volumes:
      - mariadb:/var/lib/mysql
    networks:
      - inception
    restart: on-failure
    expose:
      - "3306"
    env_file:
      - .env
    environment:
      DB_PASSWORD: /run/secrets/db_password
      DB_ROOT_PASSWORD: /run/secrets/db_root_password
    secrets:
      - db_password
      - db_root_password


volumes:
  wordpress:
    driver: local
    driver_opts:
      type: 'none'
      o: 'bind'
      device: '/home/lbegliom/data/wordpress'
  mariadb:
    driver: local
    driver_opts:
      type: 'none'
      o: 'bind'
      device: '/home/lbegliom/data/mariadb'
  ssl:
    driver: local
    driver_opts:
      type: 'none'
      o: 'bind'
      device: '/home/lbegliom/data/ssl'

secrets:
  db_password:
    file: ../secrets/db_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt

networks:
  inception:
    driver: bridge